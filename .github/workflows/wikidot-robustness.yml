name: Wikidot robustness

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-and-downstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out FTML
        uses: actions/checkout@v4

      - name: Check out Wikijump develop corpus
        uses: actions/checkout@v4
        with:
          repository: Rokurolize/wikijump
          ref: develop
          path: wikijump

      - name: Install FTML Python quality-gate dependencies
        run: python3 -m pip install --requirement scripts/check_conf-requirements.txt

      - name: Verify Python quality-gate tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'

      - name: Verify Wikijump feature and full-page contracts
        shell: bash
        run: |
          python3 scripts/check_wikijump_feature_contracts.py --wikijump-root wikijump
          python3 scripts/check_wikijump_full_pages.py \
            --wikijump-root wikijump \
            --build-renderer \
            --timeout 180

      - name: Verify reviewed normalization cases in Chrome
        shell: bash
        run: |
          CHROME=""
          for candidate in google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$CHROME"
          python3 scripts/check_comparison_normalization_browser.py \
            --chrome "$CHROME" \
            --build-renderer

      - name: Install Wikijump candidate system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmagic-dev

      - name: Verify candidate FTML inside Wikijump
        shell: bash
        run: |
          python3 scripts/check_wikijump_candidate.py \
            --wikijump-root wikijump \
            --ftml-root . \
            --run-tests

      - name: Install nightly Rust and cargo-fuzz
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked

      - name: Build fuzz seed corpus
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ftml-fuzz-corpus"
          python3 scripts/build_ftml_fuzz_corpus.py \
            --output "$RUNNER_TEMP/ftml-fuzz-corpus" \
            --wikijump-root wikijump

      - name: Fuzz public FTML pipeline
        shell: bash
        run: |
          cargo +nightly fuzz run \
            --fuzz-dir fuzz \
            public_pipeline \
            "$RUNNER_TEMP/ftml-fuzz-corpus" \
            -- \
            -max_total_time=900 \
            -timeout=10

      - name: Fuzz delayed List-mode pipeline
        shell: bash
        run: |
          cargo +nightly fuzz run \
            --fuzz-dir fuzz \
            delayed_pipeline \
            "$RUNNER_TEMP/ftml-fuzz-corpus" \
            -- \
            -max_total_time=300 \
            -timeout=10

      - name: Describe fuzz artifacts
        if: always()
        shell: bash
        run: |
          python3 scripts/fuzz_artifact_manifest.py \
            --artifact-dir fuzz/artifacts/public_pipeline \
            --commit "$GITHUB_SHA" \
            --target public_pipeline \
            --output "$RUNNER_TEMP/fuzz-artifact-manifest.json"
          python3 scripts/fuzz_artifact_manifest.py \
            --artifact-dir fuzz/artifacts/delayed_pipeline \
            --commit "$GITHUB_SHA" \
            --target delayed_pipeline \
            --output "$RUNNER_TEMP/delayed-fuzz-artifact-manifest.json"

      - name: Upload fuzz failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidot-public-pipeline-fuzz-artifacts
          path: |
            fuzz/artifacts/public_pipeline/
            ${{ runner.temp }}/fuzz-artifact-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload delayed fuzz failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidot-delayed-pipeline-fuzz-artifacts
          path: |
            fuzz/artifacts/delayed_pipeline/
            ${{ runner.temp }}/delayed-fuzz-artifact-manifest.json
          if-no-files-found: warn
          retention-days: 14
